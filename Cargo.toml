[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/storage",
    "crates/crypto",
    "crates/ui",
]
default-members = ["apps/desktop"]
# Vendored third-party code: built as a dependency, not linted as ours.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
publish = false
authors = ["Mohammed Safwan"]

[workspace.dependencies]
# Internal crates
keepstone-core = { path = "crates/core" }
keepstone-storage = { path = "crates/storage" }
keepstone-crypto = { path = "crates/crypto" }
keepstone-ui = { path = "crates/ui" }

# UI. gpui-kit re-exports a pinned GPUI snapshot (gpui-pre). Never add `gpui` directly.
gpui-kit = "0.9.0"
# Note editor (Obsidian-style live preview) and its LaTeX renderer. Both depend on
# `gpui-pre` directly, so they are pinned exactly and must resolve to the SAME
# gpui-pre as gpui-kit (`cargo tree -d -i gpui-pre` shows one). See ADR 0004.
zorite-editor = "=0.11.3"
ratex-gpui = { version = "=0.4.1", default-features = false }

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29", features = ["v7", "serde"] }
jiff = { version = "0.2.40", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"

# Same version as gpui-kit's DatePicker uses.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Storage
# Pinned to 0.40 because rusqlite_migration 2.6 depends on it (only one libsqlite3-sys may link).
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"

# Crypto
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.4"

# Dev
tempfile = "3"

# Keepstone's patched copy of zorite-editor (ADR 0004, vendor/zorite-editor/PATCHES.md).
[patch.crates-io]
zorite-editor = { path = "vendor/zorite-editor" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

# GPUI is slow in plain debug builds. Optimise the framework, keep our crates debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.keepstone-desktop]
opt-level = 0

# Release speed with symbols, for profiling (scripts/perf.sh, `sample`).
[profile.perf]
inherits = "release"
strip = false
debug = "line-tables-only"
panic = "unwind"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
