name: Native updater integration
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['native/**', 'scripts/test-sparkle.py', 'scripts/test-velopack.py', 'scripts/update-test-signing.py', 'scripts/fetch-sparkle.py', 'scripts/build-sparkle-core.py', 'tools/native-update-fixture/**', 'apps/desktop/src/updates/**', '.github/workflows/update-probes.yml']
  push:
    branches: [main, 'codex/**']
    paths: ['native/**', 'scripts/test-sparkle.py', 'scripts/test-velopack.py', 'scripts/update-test-signing.py', 'scripts/fetch-sparkle.py', 'scripts/build-sparkle-core.py', 'tools/native-update-fixture/**', 'apps/desktop/src/updates/**', '.github/workflows/update-probes.yml']
permissions:
  contents: read
jobs:
  sparkle:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python3 scripts/build-sparkle-core.py
      - name: Compile actual Sparkle bridge
        run: >-
          xcrun swiftc -swift-version 5 -warnings-as-errors -parse-as-library -D UPDATER_TESTING
          -F target/tools/sparkle/core -framework Sparkle -framework AppKit
          -Xlinker -rpath -Xlinker '@executable_path/../../../../Frameworks'
          native/macos/CalmfoldUpdater.swift -o target/tools/sparkle/CalmfoldUpdater
      - name: Installed upgrade, relaunch and signature rejection
        run: python3 scripts/test-sparkle.py
  velopack:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-update-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/native-update-fixture -> ../../target/native-update-fixture
          cache-on-failure: true
      - run: rustup show
      - run: cargo fmt --manifest-path tools/native-update-fixture/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path tools/native-update-fixture/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --release --manifest-path tools/native-update-fixture/Cargo.toml
      - name: Build real native fixtures
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/vpk" vpk --version 1.2.161
          New-Item -ItemType Directory -Force target/native-release-test/payload | Out-Null
          Copy-Item target/native-update-fixture/release/calmfold-native-update-fixture.exe target/native-release-test/payload/Calmfold.exe
          [IO.File]::WriteAllText((Join-Path $PWD 'target/native-release-test/payload/sibling.txt'), 'old sibling')
          if (!(Test-Path -LiteralPath target/native-release-test/payload/sibling.txt)) { throw 'Old fixture sibling was not written' }
          & "$env:RUNNER_TEMP/vpk/vpk.exe" pack --packId Calmfold --packVersion 1.0.0 --packDir target/native-release-test/payload --mainExe Calmfold.exe --outputDir target/native-release-test/old --channel win --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText((Join-Path $PWD 'target/native-release-test/payload/sibling.txt'), 'new sibling')
          if ((Get-Content -Raw -LiteralPath target/native-release-test/payload/sibling.txt) -ne 'new sibling') { throw 'New fixture sibling was not written' }
          & "$env:RUNNER_TEMP/vpk/vpk.exe" pack --packId Calmfold --packVersion 1.0.1 --packDir target/native-release-test/payload --mainExe Calmfold.exe --outputDir target/native-release-test/new --channel win --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed upgrade, relaunch and authenticated rejection
        run: python scripts/test-velopack.py target/native-release-test/old target/native-release-test/new
