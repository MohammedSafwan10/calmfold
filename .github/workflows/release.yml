name: Release candidate
# Produces a complete, verified candidate. Publication to the separate public
# artifacts repository is a final draft-to-published operation by the owner/agent.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Workspace version to build (for example 0.1.2)'
        required: true
# Never interrupt an installation/signing candidate with a second dispatch.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  engines:
    uses: ./.github/workflows/update-probes.yml
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          cache-on-failure: true
      - shell: bash
        run: scripts/check.sh
  build:
    env:
      OTTERO_SPARKLE_DIR: ${{ github.workspace }}/.native-tools/sparkle
    # Do not spend time packaging a candidate whose quality/native gates failed.
    needs: [engines, quality]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: Swatinem/rust-cache@v2
        with: {key: release}
      - name: Validate requested version against source
        shell: bash
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert os.environ['REQUESTED'].removeprefix('v') == version, 'source/version mismatch'
          with open(os.environ['GITHUB_ENV'],'a') as file: file.write('VERSION='+version+'\n')
          PY
      - name: Build Mac native bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/bundle-mac.sh
          mkdir -p dist
          ditto -c -k --keepParent target/release/Ottero.app "dist/Ottero-${VERSION}-macos-arm64.zip"
      - name: Sign and verify Sparkle archive and appcast
        if: runner.os == 'macOS'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'sparkle.key'
          try:
              key.write_text(os.environ['SPARKLE_KEY']); key.chmod(0o600)
              subprocess.run(['python3','scripts/sign-appcast.py',os.environ['VERSION'],'dist',str(key)],check=True)
          finally: key.unlink(missing_ok=True)
          PY
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with: {dotnet-version: '8.0.x'}
      - name: Build Windows native packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p ottero-desktop --bin ottero
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --tool-path "$env:RUNNER_TEMP/vpk" vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/release-payload | Out-Null
          Copy-Item target/release/ottero.exe target/release-payload/Ottero.exe
          Copy-Item LICENSE,NOTICE target/release-payload/
          python scripts/release-source.py target/release-payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/third-party-notices.py target/release-payload/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/vpk/vpk.exe" pack --packId Calmfold --packTitle Ottero --packVersion $env:VERSION --packDir target/release-payload --mainExe Ottero.exe --outputDir dist --channel win --runtime win-x64 --icon assets/brand/ottero.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # packId stays Calmfold (installed apps' identity, ADR 0009); only the
          # downloaded installer file names carry the product name.
          Rename-Item dist/Calmfold-win-Setup.exe Ottero-win-Setup.exe -ErrorAction Stop
          Rename-Item dist/Calmfold-win-Portable.zip Ottero-win-Portable.zip -ErrorAction Stop
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          retention-days: 3
          path: |
            dist/*.zip
            dist/*.exe
            dist/*-full.nupkg
            dist/appcast.xml
          if-no-files-found: error
  catalog:
    needs: [engines, quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign and verify complete catalog
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'minisign.key'
          try:
              key.write_text(os.environ['MINISIGN_KEY']); key.chmod(0o600)
              subprocess.run(['scripts/make-feed.sh',version,'dist',str(key)],check=True)
          finally: key.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          retention-days: 7
          path: dist/*
          if-no-files-found: error
