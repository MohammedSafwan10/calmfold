name: Refresh holiday data

# Once a month: regenerate crates/core/data/holidays.txt from the latest
# `holidays` release and open a pull request if anything changed (new
# announced dates, corrected lunar holidays, the year window moving on).
# Review the diff, let CI pass, merge.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Use the latest holidays release
        run: |
          latest=$(curl -fsSL https://pypi.org/pypi/holidays/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          sed -i -E "s/\"holidays==[0-9.]+\"/\"holidays==${latest}\"/" scripts/gen-holidays.py
          echo "HOLIDAYS_VERSION=${latest}" >> "$GITHUB_ENV"
      - name: Regenerate
        run: uv run scripts/gen-holidays.py
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          branch="holidays-${HOLIDAYS_VERSION}-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/gen-holidays.py crates/core/data/holidays.txt
          git commit -m "Refresh holiday data (holidays ${HOLIDAYS_VERSION})"
          git push origin "$branch"
          gh pr create --title "Refresh holiday data (holidays ${HOLIDAYS_VERSION})" \
            --body "Regenerated by .github/workflows/holidays.yml. Check a few dates for your countries before merging."
